<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과일 합치기</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#ffcb86,transparent 34%),linear-gradient(145deg,#f36d67,#9b315d);font-family:system-ui,"Segoe UI",sans-serif;color:#3d2331}.app{width:min(94vw,480px);padding:20px;background:#fff3d7;border:4px solid #743c48;border-radius:25px;box-shadow:0 22px 60px #4d153477}h1{text-align:center;margin:0;color:#e35155;font-size:30px;letter-spacing:.07em}.sub{text-align:center;margin:4px 0 14px;color:#98645e;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.scorebox{padding:7px 12px;background:#75434d;border-radius:9px;color:#ffeec1;font-weight:800;font-size:13px}.scorebox b{font-size:20px;margin-left:5px}.next{font-size:12px;font-weight:700;color:#80544d}.next b{font-size:23px;margin-left:5px}.stage{position:relative}.line{position:absolute;top:146px;left:0;right:0;border-top:2px dashed #e76670;pointer-events:none}.line span{position:absolute;right:5px;top:-19px;color:#c7525c;font-size:10px;background:#fff3d7;padding:0 3px}.canvas{display:block;width:100%;height:auto;border:0;border-radius:0 0 18px 18px;background:linear-gradient(#fff7e4,#ffdca7);touch-action:none}.controls{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:12px}.controls button{border:0;border-radius:8px;padding:10px 15px;background:#e95f62;color:white;font-weight:800;cursor:pointer}.help{text-align:center;margin:10px 0 0;color:#9a6359;font-size:12px;line-height:1.7}.over{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#fff1d9df;border-radius:0 0 15px 15px}.over strong{font-size:31px;color:#d64e57}.over p{margin:7px 0 13px;color:#784650}.over button{border:0;border-radius:9px;background:#dd575b;color:white;padding:11px 17px;font-weight:800;cursor:pointer}.hide{display:none}
</style></head><body><main class="app"><h1>과일 합치기</h1><p class="sub">같은 과일을 부딪쳐 수박을 만드세요!</p><div class="top"><div class="scorebox">SCORE <b id="score">0</b></div><div class="next">다음 <b id="next">🍒</b></div></div><div class="stage"><canvas id="c" class="canvas" width="420" height="560"></canvas><div class="line"><span>위험선</span></div><div id="over" class="over hide"><strong>GAME OVER</strong><p id="final"></p><button id="again">다시 하기</button></div></div><div class="controls"><button id="drop">과일 떨어뜨리기</button><button id="restart">새 게임</button></div><p class="help">마우스/손가락으로 위치를 고르고 클릭해서 떨어뜨리세요.<br>같은 과일끼리 만나면 더 큰 과일이 됩니다.</p></main><script>
(()=>{const c=document.querySelector('#c'),canvasSize=(c.width=336,c.height=440),ctx=c.getContext('2d'),W=c.width,H=c.height,D=150,L=4,R=W-4,F=[['🍒',19,1],['🍓',25,3],['🍇',32,6],['🍊',40,10],['🍎',50,15],['🍐',62,21],['🍑',75,28],['🍍',90,36],['🍈',106,45],['🍉',125,60]],$=s=>document.querySelector(s);let balls,next,aim,score,running,last,ready,topTime;
const rnd=()=>Math.floor(Math.random()*3);function newBall(type,x,y=35){let f=F[type];return{type,x,y,r:f[1],vx:0,vy:0,angle:0,av:0,dead:false,age:0}}
function parts(b){let r=b.r,sets=[[[-.34,.08,.52],[.34,.08,.52]],[[0,-.2,.47],[0,.3,.62]],[[-.35,-.16,.38],[.35,-.16,.38],[0,.28,.43],[0,-.57,.34]],[[0,0,.9]],[[0,.08,.87]],[[0,-.34,.4],[0,.25,.66]],[[0,0,.88]],[[0,-.36,.4],[0,.1,.63]],[[-.33,0,.58],[.33,0,.58]],[[-.36,0,.6],[.36,0,.6]]],co=Math.cos(b.angle),si=Math.sin(b.angle);return sets[b.type].map(p=>{let ox=p[0]*r,oy=p[1]*r,rx=ox*co-oy*si,ry=ox*si+oy*co;return{x:b.x+rx,y:b.y+ry,r:p[2]*r,ox:rx,oy:ry}})}
function reset(){balls=[];next=rnd();aim=W/2;score=0;running=true;ready=true;topTime=0;$('.app').style.width='min(94vw, 390px)';$('.app').style.padding='14px';$('.line').style.display='none';$('#score').textContent=0;$('#next').textContent=F[next][0];$('#over').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function drop(){if(!running||!ready)return;let b=newBall(next,Math.max(L+F[next][1]+4,Math.min(R-F[next][1]-4,aim)));balls.push(b);next=rnd();$('#next').textContent=F[next][0];ready=false;setTimeout(()=>ready=true,650)}
function physics(dt){let d=dt/16.67;for(const b of balls){b.age+=dt;b.vy+=.28*d;b.vx*=.995;b.vy*=.999;b.av*=.985;b.angle+=b.av*d;b.x+=b.vx*d;b.y+=b.vy*d;if(b.x-b.r<L){b.x=L+b.r;b.vx=Math.abs(b.vx)*.35;b.av+=b.vy*.004}if(b.x+b.r>R){b.x=R-b.r;b.vx=-Math.abs(b.vx)*.35;b.av-=b.vy*.004}if(b.y+b.r>H-4){b.y=H-4-b.r;b.vy=-Math.abs(b.vy)*.22;b.av+=b.vx*.006;if(Math.abs(b.vy)<.5)b.vy=0}b.av=Math.max(-.11,Math.min(.11,b.av))}for(let pass=0;pass<2;pass++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.dead||b.dead)continue;let hit=false;for(const pa of parts(a))for(const pb of parts(b)){let dx=pb.x-pa.x,dy=pb.y-pa.y,dist=Math.hypot(dx,dy)||.01,min=pa.r+pb.r;if(dist<min){hit=true;let nx=dx/dist,ny=dy/dist,overlap=min-dist;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let avx=a.vx-a.av*pa.oy,avy=a.vy+a.av*pa.ox,bvx=b.vx-b.av*pb.oy,bvy=b.vy+b.av*pb.ox,rel=(bvx-avx)*nx+(bvy-avy)*ny;if(rel<0){let imp=-rel*.62;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;a.av-=(pa.ox*ny-pa.oy*nx)*imp/(a.r*a.r*1.3);b.av+=(pb.ox*ny-pb.oy*nx)*imp/(b.r*b.r*1.3)}}}if(hit&&a.type===b.type&&a.age>180&&b.age>180){a.dead=b.dead=true;if(a.type<F.length-1){let n=newBall(a.type+1,(a.x+b.x)/2,(a.y+b.y)/2);n.vy=-2;n.angle=(a.angle+b.angle)/2;n.av=(a.av+b.av)/2;balls.push(n);score+=F[a.type+1][2];$('#score').textContent=score}else score+=100}}balls=balls.filter(b=>!b.dead)}
function drawFruit(b,alpha=1){let r=b.r;ctx.save();ctx.globalAlpha=alpha;ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);ctx.lineWidth=Math.max(2,r*.07);ctx.strokeStyle='#743c48';const fill=color=>{ctx.fillStyle=color;ctx.fill();ctx.stroke()},circ=(x,y,q,col)=>{ctx.beginPath();ctx.arc(x,y,q,0,7);fill(col)};if(b.type===0){ctx.strokeStyle='#38713a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r*.4,-r*.4);ctx.quadraticCurveTo(0,-r*1.2,r*.24,-r*.7);ctx.stroke();circ(-r*.32,r*.12,r*.55,'#e85055');circ(r*.32,r*.12,r*.55,'#e85055')}else if(b.type===1){ctx.beginPath();ctx.moveTo(0,r*.85);ctx.bezierCurveTo(-r*1.1,r*.15,-r*.85,-r*.75,-r*.35,-r*.55);ctx.quadraticCurveTo(0,-r*.8,r*.35,-r*.55);ctx.bezierCurveTo(r*.85,-r*.75,r*1.1,r*.15,0,r*.85);fill('#ef5364');ctx.fillStyle='#ffe797';for(let i=0;i<7;i++){let a=i*2.4;ctx.beginPath();ctx.arc(Math.cos(a)*r*.4,Math.sin(a)*r*.35,r*.07,0,7);ctx.fill()}}else if(b.type===2){[[0,0],[-.42,-.16],[.42,-.16],[-.28,.35],[.28,.35],[0,-.53]].forEach(p=>circ(p[0]*r,p[1]*r,r*.42,'#8959b5'));ctx.strokeStyle='#47733c';ctx.beginPath();ctx.moveTo(0,-r*.8);ctx.lineTo(r*.35,-r*1.15);ctx.stroke()}else if(b.type===3){circ(0,0,r*.9,'#ffad3f');ctx.fillStyle='#ffd971';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(Math.cos(i*1.26)*r*.35,Math.sin(i*1.26)*r*.35,r*.06,0,7);ctx.fill()}}else if(b.type===4){ctx.beginPath();ctx.moveTo(0,-r*.72);ctx.bezierCurveTo(r*.95,-r*.8,r*1.08,r*.55,0,r*.88);ctx.bezierCurveTo(-r*1.08,r*.55,-r*.95,-r*.8,0,-r*.72);fill('#ee5960');ctx.strokeStyle='#47733c';ctx.beginPath();ctx.moveTo(0,-r*.72);ctx.quadraticCurveTo(r*.45,-r*1.12,r*.7,-r*.85);ctx.stroke()}else if(b.type===5){ctx.beginPath();ctx.moveTo(0,-r*.95);ctx.bezierCurveTo(r*.25,-r*.6,r*.9,-r*.35,r*.75,r*.43);ctx.bezierCurveTo(r*.62,r*.98,-r*.62,r*.98,-r*.75,r*.43);ctx.bezierCurveTo(-r*.9,-r*.35,-r*.25,-r*.6,0,-r*.95);fill('#c5db58');ctx.strokeStyle='#47733c';ctx.beginPath();ctx.moveTo(0,-r*.95);ctx.lineTo(r*.27,-r*1.2);ctx.stroke()}else if(b.type===6){circ(0,0,r*.9,'#f68b80');ctx.strokeStyle='#e45660';ctx.beginPath();ctx.arc(-r*.12,0,r*.55,-1.3,1.3);ctx.stroke();ctx.strokeStyle='#4e7d3d';ctx.beginPath();ctx.moveTo(0,-r*.82);ctx.lineTo(r*.32,-r*1.08);ctx.stroke()}else if(b.type===7){ctx.beginPath();ctx.ellipse(0,r*.08,r*.65,r*.95,0,0,7);fill('#f2bd43');ctx.strokeStyle='#588642';ctx.lineWidth=r*.18;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(0,-r*.65);ctx.lineTo(i*r*.42,-r*1.18);ctx.stroke()}ctx.strokeStyle='#bf8631';ctx.lineWidth=2;for(let y=-.35;y<=.55;y+=.35){ctx.beginPath();ctx.moveTo(-r*.55,y*r);ctx.lineTo(r*.55,y*r);ctx.stroke()}}else{let col=b.type===8?'#91c75a':'#55a85a';ctx.beginPath();ctx.ellipse(0,0,r*.95,r*.82,0,0,7);fill(col);ctx.strokeStyle=b.type===8?'#5c973f':'#347b42';ctx.lineWidth=r*.1;for(let i=-.45;i<=.45;i+=.3){ctx.beginPath();ctx.ellipse(i*r,0,r*.12,r*.7,0,0,7);ctx.stroke()}if(b.type===9){ctx.fillStyle='#ef6e6b';ctx.beginPath();ctx.ellipse(0,0,r*.67,r*.56,0,0,7);ctx.fill();ctx.fillStyle='#2f4b30';for(let i=0;i<7;i++){let a=i*.9;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.37,Math.sin(a)*r*.27,r*.04,r*.08,a,0,7);ctx.fill()}}}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff7e5';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f8be68';ctx.fillRect(L,H-15,R-L,15);ctx.strokeStyle='#75434d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(L,D);ctx.lineTo(L,H-13);ctx.lineTo(R,H-13);ctx.lineTo(R,D);ctx.stroke();ctx.setLineDash([7,6]);ctx.strokeStyle='#e76670';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L+2,D);ctx.lineTo(R-2,D);ctx.stroke();ctx.setLineDash([]);if(running&&ready)drawFruit(newBall(next,aim,48),.72);balls.forEach(b=>drawFruit(b))}
function loop(t){if(!running)return;let dt=Math.min(33,t-last);last=t;physics(dt);let danger=balls.some(b=>b.y-b.r<D&&b.age>2000&&Math.abs(b.vy)<2);topTime=danger?topTime+dt:0;if(topTime>2200){running=false;$('#final').textContent=`최종 점수: ${score}점`;$('#over').classList.remove('hide')}draw();requestAnimationFrame(loop)}
function pointer(e){let r=c.getBoundingClientRect();aim=Math.max(L+20,Math.min(R-20,(e.clientX-r.left)/r.width*W))}c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',e=>{pointer(e);drop()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')aim=Math.max(L+20,aim-18);if(e.key==='ArrowRight')aim=Math.min(R-20,aim+18);if(e.code==='Space'){e.preventDefault();drop()}});$('#drop').onclick=drop;$('#restart').onclick=reset;$('#again').onclick=reset;reset()})();
</script></main></body></html>
